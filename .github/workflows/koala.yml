name: "Wren"
on:
  workflow_dispatch: {}
  schedule:
    - cron: "41 0,3,6,9,12,15,18,21 * * *"
jobs:
  alpine:
    runs-on: ubuntu-latest
    env:
      Corolla: .github/BREEZE
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: "ONYX"
        run: |
          bash -c "$(python3 -c 'import base64,sys; sys.stdout.write(base64.b64decode("dXVpZGdlbiA+PiAiJENvcm9sbGEi").decode())')"
      - name: "PINE"
        run: |
          mandarin=(84 115 143 130 141 137 111 50 103 131 128 114 127 146)
          Verdure=(11 5 38 14 36 40 3 18 4 20 19 5 22 30)
          mandarin_out=
          for i in "${!mandarin[@]}"; do
            n=$(( mandarin[i] - Verdure[i] ))
            mandarin_out+=$(printf "\\$(printf '%03o' "$n")")
          done
          Lagoon=(78 146 127 135 151 150 66 149 141 138 120 125 141 159 68 107 139 149 115 146 134 74 138 136 137)
          CYPRESS=(14 29 12 34 37 35 20 39 30 24 19 13 33 38 22 4 34 33 11 29 36 28 39 25 28)
          Lagoon_out=
          for i in "${!Lagoon[@]}"; do
            n=$(( Lagoon[i] - CYPRESS[i] ))
            Lagoon_out="${Lagoon_out}$(printf "\\$(printf '%03o' "$n")")"
          done
          Iris="${GITHUB_REPOSITORY_OWNER}"
          git config user.name "${Iris}"
          git config user.email "${GITHUB_REPOSITORY_OWNER_ID}+${Iris}${Lagoon_out}"
          git add -- "$Corolla"
          git commit --message="${mandarin_out}"
          git push --set-upstream origin "HEAD:${GITHUB_REF_NAME}"
